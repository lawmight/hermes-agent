name: Validate upstream sync authentication
on:
  push:
    branches:
      - fix/upstream-sync-auth-20261011
    paths:
      - .github/workflows/validate-upstream-sync-auth.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch-pr-validation:
    if: github.repository == 'lawmight/hermes-agent' && github.ref == 'refs/heads/fix/upstream-sync-auth-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch corrected workflow in pull-request mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg ref "${GITHUB_REF_NAME}" \
            '{ref: $ref, inputs: {mode: "pull_request", force_pr_on_conflict: "false"}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/sync-upstream.yml/dispatches" --input -
