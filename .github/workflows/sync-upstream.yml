# Sync this fork with NousResearch/hermes-agent (upstream).
#
# Runs on a schedule and on manual dispatch. Uses a merge (not reset) so
# fork-local commits are preserved.
#
# Landing strategy:
#   - schedule: open/update a sync PR while direct pushes are disabled
#   - enable PUSH_TO_MAIN_ENABLED only after a successful PR-mode validation
#   - workflow_dispatch mode=pull_request: open/update a sync PR
#   - workflow_dispatch mode=push_to_main: push directly when clean
#
# Checkout uses GITHUB_TOKEN without persisted credentials. The PAT is used
# only for credential checks and pushes; PR operations use GITHUB_TOKEN.
# Required repo secret when upstream changes workflows:
#   UPSTREAM_SYNC_TOKEN — PAT (classic or fine-grained) with:
#     - contents: read/write
#     - workflows: read/write   ← required whenever upstream touches
#       `.github/workflows/*`; without it the push is rejected with
#       "refusing to allow a GitHub App to create or update workflow"
#     - pull-requests: read/write is not needed for this PAT;
#       PR create/edit uses GITHUB_TOKEN with pull-requests: write
#   Classic PAT: `repo` + `workflow` scopes.
#   Fine-grained: Contents + Workflows (Read and write) on this fork;
#   Allow GitHub Actions to create pull requests in repository settings.

name: Sync upstream

on:
  schedule:
    # Daily 06:15 UTC — offset from the hour to avoid thundering herds.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "How to land a clean merge"
        type: choice
        options:
          - push_to_main
          - pull_request
        default: pull_request
      force_pr_on_conflict:
        description: "Open a conflict-marker PR when merge fails (for manual resolution)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # Only meaningful on forks of NousResearch/hermes-agent.
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_REPO: NousResearch/hermes-agent
      UPSTREAM_BRANCH: main
      # Branch-ref validation must not overwrite the production sync branch.
      SYNC_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'sync/upstream-main' || 'sync/upstream-auth-validation' }}
      # Re-enable in a reviewed change only after PR-mode validation succeeds.
      PUSH_TO_MAIN_ENABLED: 'false'
      HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Diagnose sync push credentials
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import subprocess
          import tempfile
          import urllib.error
          import urllib.request

          token = os.environ["SYNC_PUSH_TOKEN"]
          server = os.environ["GITHUB_SERVER_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          header = "AUTHORIZATION: basic " + base64.b64encode(
              ("x-access-token:" + token).encode()
          ).decode()
          print("::add-mask::" + header)

          # Probe v6's exact gitdir condition without writing any credential.
          # Only report whether Git includes the file; never print config values.
          gitdir = str(pathlib.Path(".git").resolve())
          with tempfile.TemporaryDirectory() as tmp:
              cred = pathlib.Path(tmp) / "probe.config"
              cred.write_text('[syncprobe]\n  included = true\n')
              config = pathlib.Path(tmp) / "include.config"
              subprocess.run(["git", "config", "--file", str(config),
                              "includeIf.gitdir:" + gitdir + ".path", str(cred)],
                             check=True)
              probe = subprocess.run(["git", "-c", "include.path=" + str(config),
                                      "config", "--get", "syncprobe.included"],
                                     capture_output=True, text=True)
              print("Original v6 includeIf condition matches: " +
                    str(probe.returncode == 0).lower())

          def check(url, authorization, label):
              request = urllib.request.Request(url, headers={
                  "Authorization": authorization,
                  "User-Agent": "hermes-upstream-sync",
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
              except urllib.error.HTTPError as error:
                  status = error.code
              print(label + ": HTTP " + str(status))
              if status == 401:
                  raise SystemExit("::error::Sync token rejected: invalid, expired, or revoked. Obtain authorization before rotation.")
              if status != 200:
                  raise SystemExit("::error::Sync token access denied or unavailable. Check repository selection, Contents read/write, and account/policy authorization; do not assume expiration.")

          if os.environ["HAS_SYNC_TOKEN"] == "true":
              check(os.environ["GITHUB_API_URL"] + "/user",
                    "Bearer " + token, "PAT identity authentication")
          check(server + "/" + repo + ".git/info/refs?service=git-receive-pack",
                header.split(": ", 1)[1], "Git push authorization (no ref changes)")
          print("Push credential accepted. Workflows write permission is verified by the actual sync-branch push.")
          PY

      - name: Block direct-push mode until PR validation succeeds
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'push_to_main' && env.PUSH_TO_MAIN_ENABLED != 'true'
        run: |
          echo "::error::Direct pushes are disabled. Validate with mode=pull_request before re-enabling PUSH_TO_MAIN_ENABLED."
          exit 1

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          AUTH=$(printf 'x-access-token:%s' "${CHECKOUT_TOKEN}" | base64 -w0)
          echo "::add-mask::${AUTH}"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}" \
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Measure drift
        id: drift
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          BEHIND=$(git rev-list --count "origin/${DEFAULT_BRANCH}..upstream/${UPSTREAM_BRANCH}")
          AHEAD=$(git rev-list --count "upstream/${UPSTREAM_BRANCH}..origin/${DEFAULT_BRANCH}")
          UPSTREAM_SHA=$(git rev-parse --short "upstream/${UPSTREAM_BRANCH}")
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "default_branch=${DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Fork is ${BEHIND} commit(s) behind and ${AHEAD} commit(s) ahead of upstream/${UPSTREAM_BRANCH} (${UPSTREAM_SHA})."

      - name: Skip when already up to date
        if: steps.drift.outputs.behind == '0'
        run: echo "Already up to date with upstream/${UPSTREAM_BRANCH}; nothing to do."

      - name: Merge upstream into sync branch
        id: merge
        if: steps.drift.outputs.behind != '0'
        run: |
          DEFAULT_BRANCH="${{ steps.drift.outputs.default_branch }}"
          git checkout -B "${SYNC_BRANCH}" "origin/${DEFAULT_BRANCH}"

          set +e
          git merge "upstream/${UPSTREAM_BRANCH}" --no-edit \
            -m "Merge upstream/${UPSTREAM_BRANCH} from ${UPSTREAM_REPO}

          Automated sync: ${{ steps.drift.outputs.behind }} commit(s) from upstream/${UPSTREAM_BRANCH} (${{ steps.drift.outputs.upstream_sha }})."
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "Merge completed cleanly."
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "Merge has conflicts."
            if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force_pr_on_conflict }}" = "true" ]; then
              # Leave conflict markers in the working tree and commit so a human
              # can resolve them in the PR UI / locally.
              git add -A
              git commit --no-edit -m "WIP: sync upstream/${UPSTREAM_BRANCH} (conflicts — needs manual resolution)" || \
                git commit -am "WIP: sync upstream/${UPSTREAM_BRANCH} (conflicts — needs manual resolution)"
              echo "conflict_pr=true" >> "$GITHUB_OUTPUT"
            else
              git merge --abort
              echo "conflict_pr=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Require a workflow-capable token when workflows changed
        if: >
          steps.drift.outputs.behind != '0'
          && (steps.merge.outputs.clean == 'true' || steps.merge.outputs.conflict_pr == 'true')
          && env.HAS_SYNC_TOKEN != 'true'
        run: |
          DEFAULT_BRANCH="${{ steps.drift.outputs.default_branch }}"
          # Compare the sync tip against origin default for workflow-path churn.
          if git diff --name-only "origin/${DEFAULT_BRANCH}"...HEAD -- '.github/workflows' | grep -q .; then
            {
              echo "## UPSTREAM_SYNC_TOKEN required"
              echo ""
              echo "This sync updates files under \`.github/workflows/\`."
              echo "\`GITHUB_TOKEN\` cannot push those changes."
              echo ""
              echo "After authorization, set repo secret **UPSTREAM_SYNC_TOKEN**"
              echo "with Contents and Workflows read/write, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing UPSTREAM_SYNC_TOKEN::Sync touches workflow files. Set UPSTREAM_SYNC_TOKEN with Contents and Workflows read/write after authorization."
            exit 1
          fi

      - name: Push sync branch
        id: push
        if: steps.drift.outputs.behind != '0' && (steps.merge.outputs.clean == 'true' || steps.merge.outputs.conflict_pr == 'true')
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          # Supply push credentials only to this step, without storing them.
          AUTH=$(printf 'x-access-token:%s' "${SYNC_PUSH_TOKEN}" | base64 -w0)
          echo "::add-mask::${AUTH}"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0=""
          export GIT_CONFIG_KEY_1="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${AUTH}"
          export GIT_TERMINAL_PROMPT=0
          set +e
          PUSH_OUT=$(git push -u origin "${SYNC_BRANCH}" --force-with-lease 2>&1)
          PUSH_STATUS=$?
          set -e
          printf '%s\n' "${PUSH_OUT}"

          if [ "${PUSH_STATUS}" -eq 0 ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "${PUSH_OUT}" | grep -q "without \`workflows\` permission"; then
            {
              echo "## Push blocked: workflows permission missing"
              echo ""
              echo "GitHub rejected the push because this sync updates"
              echo "\`.github/workflows/*\` and the token lacks the **workflows** permission."
              echo ""
              echo "Fix:"
              echo "1. After authorization, create a PAT with Contents and Workflows (read/write)"
              echo "   — classic: \`repo\` + \`workflow\` scopes"
              echo "2. Store it as repo secret \`UPSTREAM_SYNC_TOKEN\`"
              echo "3. Re-run **Sync upstream**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Workflows permission required::Set UPSTREAM_SYNC_TOKEN to a PAT with workflows write permission (upstream changed workflow files)."
          else
            echo "::error title=Push failed::git push of ${SYNC_BRANCH} failed."
          fi
          exit "${PUSH_STATUS}"

      - name: Push clean merge directly to default branch
        id: push_main
        if: >
          steps.drift.outputs.behind != '0'
          && steps.merge.outputs.clean == 'true'
          && steps.push.outputs.pushed == 'true'
          && env.PUSH_TO_MAIN_ENABLED == 'true'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && (
            github.event_name == 'schedule'
            || (github.event_name == 'workflow_dispatch' && inputs.mode == 'push_to_main')
          )
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          # Supply push credentials only to this step, without storing them.
          AUTH=$(printf 'x-access-token:%s' "${SYNC_PUSH_TOKEN}" | base64 -w0)
          echo "::add-mask::${AUTH}"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0=""
          export GIT_CONFIG_KEY_1="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${AUTH}"
          export GIT_TERMINAL_PROMPT=0
          DEFAULT_BRANCH="${{ steps.drift.outputs.default_branch }}"
          set +e
          PUSH_OUT=$(git push origin "${SYNC_BRANCH}:${DEFAULT_BRANCH}" 2>&1)
          PUSH_STATUS=$?
          set -e
          printf '%s\n' "${PUSH_OUT}"

          if [ "${PUSH_STATUS}" -eq 0 ]; then
            echo "pushed_main=true" >> "$GITHUB_OUTPUT"
            echo "Pushed clean upstream merge directly to origin/${DEFAULT_BRANCH}."
            {
              echo "## Upstream sync landed on \`${DEFAULT_BRANCH}\`"
              echo ""
              echo "Clean merge of \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` (\`${{ steps.drift.outputs.upstream_sha }}\`) was pushed to \`${DEFAULT_BRANCH}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if printf '%s\n' "${PUSH_OUT}" | grep -q "without \`workflows\` permission"; then
            {
              echo "## Push to ${DEFAULT_BRANCH} blocked: workflows permission missing"
              echo ""
              echo "Set repo secret \`UPSTREAM_SYNC_TOKEN\` to a PAT with Workflows"
              echo "read/write, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Workflows permission required::Set UPSTREAM_SYNC_TOKEN with workflows write permission."
          fi
          exit "${PUSH_STATUS}"

      - name: Open or update sync pull request
        id: pr
        if: >
          steps.drift.outputs.behind != '0'
          && steps.push.outputs.pushed == 'true'
          && steps.push_main.outcome != 'success'
          && (
            (github.event_name == 'workflow_dispatch' && inputs.mode == 'pull_request')
            || (github.event_name == 'schedule' && env.PUSH_TO_MAIN_ENABLED != 'true')
            || steps.merge.outputs.conflict_pr == 'true'
          )
        env:
          BEHIND: ${{ steps.drift.outputs.behind }}
          AHEAD: ${{ steps.drift.outputs.ahead }}
          UPSTREAM_SHA: ${{ steps.drift.outputs.upstream_sha }}
          DEFAULT_BRANCH: ${{ steps.drift.outputs.default_branch }}
          CLEAN: ${{ steps.merge.outputs.clean }}
          # Fine-grained sync PATs often lack pull-requests write and can
          # return empty `gh pr list` results (exit 0). Use the workflow
          # GITHUB_TOKEN for all PR list/create/edit operations.
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="chore: sync upstream/${UPSTREAM_BRANCH} (${UPSTREAM_SHA})"
          if [ "${CLEAN}" = "true" ]; then
            BODY=$(cat <<EOF
          ## Upstream sync

          Automated merge of [\`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`](https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_BRANCH}) (\`${UPSTREAM_SHA}\`) into this fork.

          | | |
          |---|---|
          | Behind upstream | ${BEHIND} commit(s) |
          | Ahead of upstream (fork-only) | ${AHEAD} commit(s) |
          | Merge | clean |

          Fork-local commits are preserved (merge, not reset).

          Merge this PR to update \`${DEFAULT_BRANCH}\`.
          EOF
          )
          else
            BODY=$(cat <<EOF
          ## Upstream sync — conflicts need manual resolution

          Attempted to merge [\`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`](https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_BRANCH}) (\`${UPSTREAM_SHA}\`) into this fork.

          | | |
          |---|---|
          | Behind upstream | ${BEHIND} commit(s) |
          | Ahead of upstream (fork-only) | ${AHEAD} commit(s) |
          | Merge | **conflicts** |

          Conflict markers are in this branch. Resolve them locally:

          \`\`\`bash
          git fetch origin
          git checkout ${SYNC_BRANCH}
          # fix conflicts, then:
          git add -A
          git commit -m "Merge upstream/${UPSTREAM_BRANCH} from ${UPSTREAM_REPO}"
          git push origin ${SYNC_BRANCH}
          \`\`\`
          EOF
          )
          fi

          # Drop the common leading indent that YAML run: blocks add to heredoc lines.
          BODY=$(printf '%s\n' "${BODY}" | sed -E 's/^[[:space:]]{2}//')

          # Prefer REST over gh's GraphQL helpers — some fork/token combos
          # can list pulls but still 403 on updatePullRequest/createPullRequest.
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}&state=open" --jq '.[0].number // empty')

          set +e
          if [ -n "${EXISTING}" ]; then
            RESP=$(gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${EXISTING}" \
              -f title="${TITLE}" -f body="${BODY}" 2>&1)
            STATUS=$?
          else
            RESP=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title="${TITLE}" -f head="${SYNC_BRANCH}" -f base="${DEFAULT_BRANCH}" \
              -f body="${BODY}" 2>&1)
            STATUS=$?
          fi
          set -e

          if [ "${STATUS}" -eq 0 ]; then
            if [ -n "${EXISTING}" ]; then
              echo "Updated existing PR #${EXISTING}."
              echo "pr_number=${EXISTING}" >> "$GITHUB_OUTPUT"
            else
              URL=$(printf '%s\n' "${RESP}" | jq -r .html_url)
              echo "Opened ${URL}"
              echo "pr_url=${URL}" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # A branch push alone does not complete PR-mode validation.
          {
            echo "## Sync branch pushed; PR create/update blocked"
            echo ""
            echo "\`origin/${SYNC_BRANCH}\` was updated, but opening/editing the"
            echo "sync PR failed with this token:"
            echo ""
            echo '```'
            printf '%s\n' "${RESP}"
            echo '```'
            echo ""
            echo "Allow GitHub Actions to create pull requests in repository settings,"
            echo "or open the PR manually. Keep direct pushes disabled until PR validation succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=PR create/update blocked::Sync branch pushed, but PR validation is incomplete. Allow Actions to create pull requests or open the PR manually."
          exit "${STATUS}"

      - name: Fail clearly when merge conflicts (no conflict PR)
        if: >
          steps.drift.outputs.behind != '0'
          && steps.merge.outputs.clean == 'false'
          && steps.merge.outputs.conflict_pr != 'true'
        env:
          BEHIND: ${{ steps.drift.outputs.behind }}
          UPSTREAM_SHA: ${{ steps.drift.outputs.upstream_sha }}
          DEFAULT_BRANCH: ${{ steps.drift.outputs.default_branch }}
        run: |
          {
            echo "## Upstream sync blocked by merge conflicts"
            echo ""
            echo "- Behind upstream: **${BEHIND}** commit(s)"
            echo "- Upstream tip: \`${UPSTREAM_SHA}\`"
            echo "- Upstream: https://github.com/${UPSTREAM_REPO}/tree/${UPSTREAM_BRANCH}"
            echo ""
            echo "Resolve locally:"
            echo ""
            echo '```bash'
            echo "git fetch https://github.com/${UPSTREAM_REPO}.git ${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
            echo "git checkout ${DEFAULT_BRANCH}"
            echo "git merge upstream/${UPSTREAM_BRANCH}"
            echo "# fix conflicts, commit, push"
            echo '```'
            echo ""
            echo "Or re-run **Sync upstream** with \`force_pr_on_conflict=true\` to open a WIP PR containing conflict markers."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Upstream sync conflicts::Fork is ${BEHIND} commit(s) behind upstream/${UPSTREAM_BRANCH} (${UPSTREAM_SHA}) and the merge has conflicts. See the job summary for resolve steps."
          exit 1
